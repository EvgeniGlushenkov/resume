<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!-- Резюме Евгения Глушенкова · публичная версия · вставить в блок T123 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<div id="gl-resume"></div>
<script type="text/plain" id="gl-resume-css">/* Layout: плоская светлая страница, как сайт на Tilda; шапка с именем слева и фото с карточкой контактов справа; ниже плитки с цифрами, две колонки (опыт / образование и навыки) и заметки для себя под резюме */
:host{display:block;
  --bg:#f8f8f6; --surface:#ffffff; --ink:#12140f; --muted:#6a6c66; --line:#e7e7e3;
  --c-blue:#aee4f8; --c-green:#bdf0d2; --c-pink:#ffc3cc; --c-lilac:#dcc4f6; --c-yellow:#f6e8ae;
  --todo-bg:#f6e8ae; --todo-fg:#4d3d00; --danger:#b3261e;
  --f-display:"Manrope","Helvetica Neue",Arial,sans-serif;
  --f-body:"Manrope","Helvetica Neue",Arial,sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}


*{box-sizing:border-box}
.page{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--f-body);padding-inline:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-block:12px 64px;display:grid;gap:clamp(24px,4vw,44px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,.ed:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono,.eyebrow,.clabel,.meta,.sm{font-family:var(--f-mono)}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
/* верхняя панель */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.bar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs,.seg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.tabs button,.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.d0{background:var(--c-blue)}.d1{background:var(--c-lilac)}.d2{background:var(--c-pink)}
.tabs button[aria-pressed="false"] .dot{outline:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.on{background:var(--c-yellow);border-color:var(--ink)}
/* шапка */
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:28px clamp(28px,5vw,64px);align-items:start;padding-top:clamp(8px,3vw,28px)}
.name{margin:14px 0 0;font:800 clamp(44px,8.6vw,96px)/.95 var(--f-display);letter-spacing:-.045em}
.name span{display:block;overflow-wrap:anywhere}
.pos{white-space:pre-line;margin:clamp(20px,3.5vw,36px) 0 0;font:700 clamp(19px,2.5vw,27px)/1.25 var(--f-display);letter-spacing:-.02em;max-width:24ch;text-wrap:balance}
.hl{margin:12px 0 0;color:var(--muted);font-size:15px;max-width:48ch}
.side-head{display:grid;gap:14px;min-width:0}
.photo{margin:0;width:min(100%,300px);aspect-ratio:1/0.92;border-radius:58% 42% 55% 45%/48% 56% 44% 52%;overflow:hidden;background:var(--c-blue)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.card{background:var(--surface);border-radius:20px;padding:18px 20px}
.contacts{display:grid;padding-block:6px}
.crow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.clabel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.cval{font-weight:600;font-size:14.5px;overflow-wrap:anywhere;min-width:0}
/* плитки */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{border-radius:20px;padding:18px 20px;display:grid;gap:14px;align-content:space-between;min-height:132px}
.tile:nth-child(1){background:var(--c-blue)}.tile:nth-child(2){background:var(--c-green)}.tile:nth-child(3){background:var(--c-pink)}.tile:nth-child(4){background:var(--c-lilac)}
.tile .n{font:800 clamp(26px,4vw,44px)/1 var(--f-display);letter-spacing:-.04em;white-space:nowrap}
.tile .t{font-size:13px;line-height:1.4}
/* колонки */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:clamp(28px,5vw,56px);align-items:start}
.main,.side{display:grid;gap:clamp(28px,4vw,44px);min-width:0;align-content:start}
.sec>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:0 0 16px;cursor:pointer}
.sec>summary::-webkit-details-marker,.job>summary::-webkit-details-marker{display:none}
.sec>summary::before,.job>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
.sec[open]>summary::before,.job[open]>summary::before{transform:rotate(45deg)}
.st{font:800 clamp(22px,2.6vw,28px)/1.1 var(--f-display);letter-spacing:-.03em;min-width:0}
.sm{white-space:nowrap}
.side .st{font-size:22px}
.sm{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.copy{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.copy:hover{color:var(--ink);border-color:var(--ink)}
.sb{display:grid;gap:14px;min-width:0}
.note{margin:0;font-size:13px;color:var(--todo-fg);background:var(--todo-bg);padding:9px 14px;border-radius:12px}
.paras{list-style:none;margin:0;padding:0;display:grid;gap:14px;max-width:66ch;color:var(--muted);font-size:16px}
.paras li:first-child{color:var(--ink);font-size:17px}
.bul{margin:0;padding-left:18px;display:grid;gap:10px;max-width:72ch;color:var(--muted)}
.bul li::marker{color:var(--ink)}
.lead{font-weight:700;color:var(--ink)}
/* карточки опыта */
.job{background:var(--surface);border-radius:20px;padding:18px 20px}
.job+.job{margin-top:12px}
.job>summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;cursor:pointer}
.job>summary .role{grid-column:2}
.job>summary .meta{grid-column:2}
.role{margin:0;font:700 clamp(16px,1.9vw,19px)/1.3 var(--f-display);letter-spacing:-.015em;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.per{background:var(--c-blue);color:var(--ink);border-radius:999px;padding:2px 10px;white-space:nowrap}
.jb{padding:16px 0 4px;display:grid;gap:14px;border-top:1px solid var(--line);margin-top:14px}
.ctx{margin:0;color:var(--muted);font-size:14px;max-width:72ch}
.fields{display:grid;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:14px}
.fields label{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:baseline;font-size:13px;color:var(--muted)}
.fields label>*:last-child{color:var(--ink);font-size:14px}
.early{display:grid;gap:12px}
.er{display:grid;gap:8px}
.er .ctx{max-width:none}
/* навыки, образование */
.pills{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.pills li{border-radius:999px;padding:5px 13px;font-size:13.5px;font-weight:500}
.pills li:nth-child(4n+1){background:var(--c-blue)}.pills li:nth-child(4n+2){background:var(--c-green)}.pills li:nth-child(4n+3){background:var(--c-pink)}.pills li:nth-child(4n){background:var(--c-lilac)}
.tl{list-style:none;margin:0 0 0 4px;padding:0 0 0 22px;border-left:1.5px solid var(--ink);display:grid;gap:20px}
.tl>li{position:relative;display:grid;gap:2px}
.tl>li::before{content:"";position:absolute;left:-27.5px;top:.45em;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.tl .sch{font-weight:700;font-size:15px;line-height:1.35}
.tl .yr{font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tl .tx{font-size:13.5px;color:var(--muted);line-height:1.5}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.dl li{display:grid;gap:2px;padding-left:14px;border-left:3px solid var(--c-lilac)}
.dl .ttl{font-weight:700;font-size:14.5px}
.dl .tx{font-size:13.5px;color:var(--muted);line-height:1.5}
.side .bul{font-size:14px;padding-left:16px}
/* заметки для себя */
.notes{display:grid;gap:clamp(20px,3vw,32px);padding-top:clamp(16px,3vw,32px);border-top:1px solid var(--line)}
.notes>.eyebrow{margin:0}
.qa{display:grid;gap:16px}
.qa .q{font-weight:700;margin:0}
.qa .a{margin:4px 0 0;max-width:72ch;color:var(--muted)}
mark.todo{background:var(--todo-bg);color:var(--todo-fg);border-radius:4px;padding:0 4px;font-size:.92em}
@media (max-width:860px){
  .head,.cols{grid-template-columns:minmax(0,1fr)}
  .photo{width:min(100%,240px)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .sec>summary{flex-wrap:wrap}
  .sm{white-space:normal}
  .fields label{grid-template-columns:1fr}
  .crow{grid-template-columns:84px minmax(0,1fr)}
  .tile{min-height:112px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.page{text-align:left}
.wrap{grid-template-columns:minmax(0,1fr)}
p,h1,h3{color:inherit}
a{color:inherit}
.fb{background:var(--c-green);border-radius:24px;padding:clamp(20px,3vw,32px);display:grid;gap:14px}
.fb h2{margin:0;font:800 clamp(24px,3vw,34px)/1.1 var(--f-display);letter-spacing:-.03em}
.fb p{margin:0;max-width:60ch;font-size:15.5px}
.fb .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb .btn{text-decoration:none;display:inline-flex;align-items:center}
.fb .rid{font:500 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.75}
@media (max-width:560px){.bar{position:static}.bar .grp{width:100%}.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 100%}.seg{flex:none}.tabs button{white-space:nowrap;flex:none}.bar .grp:last-child .btn{width:100%;justify-content:center}}
.rid-top{font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}</script>

были компании. За время работы отвечал за множество показателей бизнеса. Зоны ответственности: продажи и бюджеты, внедрение, обучение сотрудников, удержание, обратная связь в продукт.","До IT — 12 лет в автомобильном и частном бизнесе: занимал различные позиции в официальных дилерах, отвечал за продажи новых автомобилей и авто с пробегом, основал свой бизнес с интернет-магазином. Знаю, как бизнес устроен изнутри, и говорю с клиентом на его языке — это и помогло мне вырасти в работе с ключевыми клиентами.","Каждый день работаю с AI-ассистентами и агентами: готовлю материалы, разбираю данные, автоматизирую рутину. Большое внимание уделяю современным технологиям и их интеграции в повседневные задачи."],"skills":["Управление ключевыми клиентами (KAM)","B2B-продажи, upsell и cross-sell","Переговоры с собственниками и C-level","Формирование и защита рекламных бюджетов","Удержание и работа с оттоком","Внедрение B2B SaaS и рост использования продукта","Квартальные бизнес-ревью","Работа с классифайдами и партнёрами","Обучение и онбординг клиентов","Продуктовая обратная связь"],"shortN":6,"order":["b1","b2","b4","b6","b3","b8","b9","b7","b10","b13","b11","b12","b5"]},"pm":{"label":"Проекты и внедрение","position":"Менеджер проекта \n(Project / Implementation Manager)","headline":"внедрение B2B SaaS · запуск и масштабирование · обучение","aboutShort":["Более пяти лет внедрял SaaS-платформу Автохаб (Авито) в дилерских сетях: вёл рост группы клиента с 1 до 43 центров, сократил запуск центра с 14 до 5 рабочих дней, обучил 3 500+ пользователей. Координирую техподдержку, продукт, финансы и команду клиента без прямого подчинения. Каждый день работаю с AI-ассистентами и агентами."],"about":["Более пяти лет внедрял SaaS-платформу Автохаб (Авито) в дилерских сетях. Самый крупный проект — сопровождение региональной группы, которая выросла с одного до 43 автосалонов. Вместе с техподдержкой и клиентскими менеджерами отладил процесс запуска центра: срок сократился с 14 до 5 рабочих дней, а процесс стал стандартом всего Автохаба.","Добиваюсь результата без административной власти: координировал техподдержку, финансовую службу, продуктовую команду и руководителей на стороне клиента. Обучил 3 500+ пользователей, из них около 900 сотрудников одной дилерской группы за полгода.","До IT — 12 лет в автомобильном и частном бизнесе: прошёл путь от техника до старшего техника с командой из пяти человек, продавал автомобили у официальных дилеров, основал свой бизнес с интернет-магазином и продал его.","Каждый день работаю с AI-ассистентами и агентами: готовлю материалы, разбираю данные, автоматизирую рутину."],"skills":["Управление проектами внедрения","Запуск и масштабирование на сеть филиалов","Описание и оптимизация процессов","Пилоты и проверка гипотез","Координация команд без прямого подчинения","Работа с заказчиком на уровне C-level","Программы обучения и онбординга","База знаний и документация","Сбор требований и приоритизация бэклога"],"shortN":6,"order":["b5","b4","b2","b3","b7","b8","b6","b11","b9","b10","b12"]},"ai":{"label":"AI Adoption","position":"Менеджер по внедрению AI и цифровых продуктов\n(AI and Digital Product Implementation Manager)\n","headline":"внедрение AI и цифровых продуктов · обучение команд · автоматизация рутины","aboutShort":["Внедряю цифровые инструменты так, чтобы ими пользовались: в Автохабе (Авито) использование ключевых функций выросло с 38% до 74%, обучено 3 500+ человек. С июня 2026 системно изучаю AI-агентов, коннекторы и навыки и без разработчиков собираю на них рабочие инструменты."],"about":["Внедряю цифровые инструменты так, чтобы ими пользовались. Более пяти лет отвечал за использование SaaS-платформы Автохаб (Авито) у автодилеров: использование ключевых функций выросло с 38% до 74% за счёт контроля метрик и вовлечённости, обучил 3 500+ человек.","С июня 2026 системно изучаю генеративный AI, AI-агентов, коннекторы и навыки и встраиваю их в свои процессы: создаю собственные навыки и промпты под повторяющиеся задачи, без разработчиков собираю рабочие инструменты — интерактивное резюме, лендинг, аналитические обзоры рынка.","В Авито одним из первых тестировал внутреннего AI-ассистента. По своей инициативе собрал базу знаний для коллег и Telegram-бота, через которого нужный материал можно отправить клиенту прямо со встречи."],"skills":["Внедрение цифровых продуктов и рост использования","AI-ассистенты, агенты и навыки (skills) в работе","Промпты и инструкции для команды","Автоматизация рутины: Google Таблицы, Telegram-боты","База знаний и FAQ","Программы обучения и онбординга","Сбор обратной связи и требований к продукту","No-code: сайты, интернет-магазины, каталоги","Продуктовые интервью и A/B-тесты"],"shortN":5,"order":["b7","b12","b6","b11","b3","b8","b5","b1","b2"]}},"items":{"b1":{"title":"Портфель и продажи.","text":"Сначала вёл портфель из 250+ дилерских центров, затем перешёл на работу с сегментом крупного бизнеса. Продавал и развивал продукты Авито: Автохаб, классифайд Авито Авто, Авито Селект, Авито Аукцион. Регулярно выполнял различные KPI и дополнительные цели.","short":"Вёл портфель из 250+ дилерских центров, затем сегмент крупного бизнеса. Продавал Автохаб, Авито Селект, Авито Аукцион и продвижение на классифайде."},"b2":{"title":"Крупнейший клиент.","text":"Три года целенаправленно шёл к работе с одной из крупнейших дилерских групп России: поднимал контакты из автобизнеса, выходил на руководителей через отраслевые мероприятия. Вывел переговоры на уровень собственников и C-level, ввёл регулярные бизнес-ревью и дорожную карту. Довёл клиента до крупнейшего контракта в истории Автохаба. Срок подключения сократил с 6 до 4 месяцев.","short":"Вывел переговоры с одной из крупнейших дилерских групп России на уровень собственников и C-level, довёл её до крупнейшего контракта Автохаба. Срок подключения сократил с 6 до 4 месяцев."},"b3":{"title":"Обучение в крупнейшей группе.","text":"Около 900 сотрудников за полгода: встречи в салонах, конференц-звонки, сессии с руководителями направлений. Записал видеокурс с разметкой по темам, чтобы новые сотрудники учились без меня.","short":"Обучил около 900 сотрудников за полгода и записал видеокурс с разметкой по темам."},"b4":{"title":"Сеть с 1 до 43 центров.","text":"Вёл региональную дилерскую группу из Краснодара с первого салона до федеральной сети: участвовал в стратегических сессиях клиента, выступал вместе с ним на отраслевых мероприятиях, подключил и обучил 480+ пользователей.","short":"Вёл рост дилерской группы из Краснодара с 1 до 43 центров, обучил 480+ пользователей."},"b5":{"title":"Запуск центра — с 14 до 5 рабочих дней.","text":"Проверил  гипотезу по запуску кабинета за один день на пилоте с импортёрскими кабинетами, отладил стыки между техподдержкой и клиентскими менеджерами, закрепил шаблоны и зоны ответственности. Для полноценных запусков с оплатой, фидами и подрядчиками вышли на 5 дней. Процесс внедрили во всём Автохабе.","short":"Проверил на пилоте запуск кабинета за один день, отладил стыки техподдержки и клиентских менеджеров. Запуск центра сократился с 14 до 5 рабочих дней, процесс стал стандартом Автохаба."},"b6":{"title":"Удержание при росте цен.","text":"Тарифы за эти годы выросли больше чем вдвое, рынок сжимался. Удерживал клиентов через использование продукта: приходил с расчётом, какие функции клиент недоиспользует и как они окупят новую цену. Вёл реестр отключений с причинами и планом возврата, какое-то время — по всей команде. Годовой отток портфеля снизил с 12% до 4%, использование ключевых функций поднял с 38% до 74% за счёт контроля метрик и вовлеченности, вернул 9 из 10 клиентов из зоны риска.","short":"Годовой отток портфеля снизил с 12% до 4% при росте тарифов более чем вдвое. Использование ключевых функций поднял с 38% до 74%, вернул 9 из 10 клиентов из зоны риска."},"b7":{"title":"Программа обучения с нуля.","text":"Сценарии онбординга, база знаний, FAQ, очные и онлайн-сессии для групп от 80 человек. Всего обучил 3 500+ пользователей. Онбординг завершают 92%, типовых обращений в поддержку стало на 35% меньше, оценка обучения — 4,8 из 5.","short":"Обучил 3 500+ пользователей. Онбординг завершают 92%, типовых обращений в поддержку стало на 35% меньше."},"b8":{"title":"Связь с продуктом.","text":"Раз в месяц разбирал запросы дилеров и импортёров по частоте вместе с технической командой, раз в квартал защищал приоритеты перед продуктом. За 4,5 года передал 98 инициатив: 36 вошли в roadmap, 18 реализованы. Был фича-лидом доработок — например, новых выгрузок объявлений на сторонние ресурсы и на сайты дилеров, которыми клиенты пользовались годами. Провёл 50+ продуктовых интервью и презентаций, участвовал в A/B-тестах.","short":"Передал в продукт 98 инициатив: 36 вошли в roadmap, 18 реализованы. Был фича-лидом доработок, провёл 50+ продуктовых интервью."},"b9":{"title":"Внешний контур.","text":"Настраивал и вёл интеграции дилера с классифайдами (Авито, Дром) и подрядчиками по рекламе, телефонии и CRM — от синхронизации объявлений и остатков до разбора технических сбоев. Был для дилера единой точкой ответственности за работу с внешними партнёрами.","short":"Вёл интеграции дилера с классифайдами (Авито, Дром) и подрядчиками, отвечал за них как единая точка ответственности."},"b10":{"title":"Направление новых автомобилей.","text":"Последние полгода переносил модель работы с автомобилями с пробегом на новый сегмент: подключал дилеров новых авто к Автохабу, работал вместе с командой по импортёрам.","short":"Полгода переносил модель работы на новые автомобили и подключал дилеров новых авто к Автохабу."},"b11":{"title":"Внутренний эксперт.","text":"Коллеги приходили ко мне за решением в сложных случаях. Вёл стажёров, онбордил коллег на новые роли, отвечал за командную метрику вовлечённости клиентов, вёл внутренние встречи команды.","short":"Вёл стажёров, онбордил коллег на новые роли, отвечал за командную метрику вовлечённости."},"b12":{"title":"База знаний и Telegram-бот.","text":"По своей инициативе собрал для коллег навигатор по материалам — продажи, продукт, коммуникации — со ссылками на Google Docs, Confluence и Redash. Завёл Telegram-канал и бота, чтобы в командировке или на встрече отправить клиенту нужную инструкцию одной командой. Одним из первых тестировал внутреннего AI-ассистента Авито и передавал обратную связь продукту.","short":"Собрал базу знаний для коллег и Telegram-бота с материалами. Одним из первых тестировал внутреннего AI-ассистента Авито."},"b13":{"title":"Отраслевые мероприятия.","text":"Участвовал в отраслевых конференциях и бизнес-встречах как эксперт по продукту.","short":"Участвовал в отраслевых конференциях как эксперт по продукту."}},"jobs":[{"id":"ai","role":"Изучение и внедрение AI в рабочие процессы","place":"Самостоятельная практика, Санкт-Петербург","period":"июнь 2026 — сейчас","bullets":["Системно изучаю генеративный AI, AI-агентов, коннекторы (connectors) и навыки (skills) для них. Работаю с несколькими моделями и сервисами, сравниваю их на своих задачах и оставляю в работе те, что дают результат.","Создаю собственные навыки и промпты для агентов под повторяющиеся задачи: работа с презентациями, документами, аналитика, подготовка материалов.","Без разработчиков собираю с помощью AI рабочие инструменты: интерактивное резюме, лендинг, аналитические обзоры рынка, личный сайт и другие проекты."],"shortBullets":["Изучаю генеративный AI, AI-агентов, коннекторы и навыки и встраиваю их в рабочие процессы.","Без разработчиков собираю с помощью AI рабочие инструменты: интерактивное резюме, лендинг, аналитические обзоры рынка."]},{"id":"avito","avito":true,"role":"Старший менеджер по работе с ключевыми клиентами","place":"Авито · Автохаб (ранее MaxPoster), Санкт-Петербург","period":"апрель 2021 — июнь 2026","context":"Автохаб — SaaS-платформа для автодилеров: публикация объявлений на классифайдах, оценка стоимости, выкуп и продажа автомобилей с внедрением ИИ-технологий. Пришёл в стартап MaxPoster, когда его приобрел Авито, и прошёл интеграцию до конца. \nПуть: менеджер по работе с ключевыми клиентами → старший менеджер по работе с ключевыми клиентами.","contextShort":"SaaS-платформа для автодилеров с ИИ-технологиями. Пришёл в стартап MaxPoster, когда его приобрёл Авито, вырос до старшего менеджера."},{"id":"autospot","role":"Региональный представитель","place":"Автоспот, Санкт-Петербург","period":"ноябрь 2020 — апрель 2021","bullets":["Расширял регионы присутствия продукта и взаимодействовал с собственниками процессов (маркетологи, директора и собственники).","Подключал дилерские центры к платформе, обучал сотрудников салонов работе с лидами, контролировал качество обработки заявок.","Настраивал интеграции (API, фиды и webhook) и техническое взаимодействие между автосалонами и продуктом."],"shortBullets":["Подключал дилерские центры к платформе и расширял её присутствие в регионах, работал с директорами и собственниками.","Настраивал интеграции с автосалонами: API, фиды, webhook."]},{"id":"ip","role":"Индивидуальный предприниматель, Санкт-Петербург","place":"ИП Глушенков · торговля продуктами питания, онлайн и офлайн, интернет-магазин","period":"февраль 2016 — август 2018","bullets":["Собрал цифровой контур без IT-команды: сайт на Adobe Muse, витрина и приём заказов на Ecwid, домен и сервер, каталог и остатки, статусы заказов, шаблоны документов. Этот проект определил мой интерес к IT-коммерции и SaaS.","Запустил и вёл торговый бизнес полного цикла: закупки и ассортимент, оптовые поставки в небольшие магазины, розничная точка, интернет-магазин и собственная курьерская служба из двух человек. Ассортимент: плодоовощная продукция, орехи, сухофрукты, экзотические продукты.","Закрывал регуляторную часть: онлайн-касса и фискализация, налоговая отчётность, электронные подписи, площадки госзакупок. Участвовал в профильных выставках."],"shortBullets":["Собрал цифровой контур бизнеса без IT-команды: сайт, интернет-магазин на Ecwid, учёт заказов и остатков.","Вёл торговый бизнес полного цикла: закупки, опт, розница, интернет-магазин и своя курьерская служба."]}],"early":{"period":"2008 — 2021","groups":[{"role":"Менеджер по продажам автомобилей","place":" Inchcape · Wagner · Аксель-Моторс, Санкт-Петербург","period":"2018 — 2021","bullets":["Inchcape, август 2018 — ноябрь 2019: автомобили с пробегом. В пилотной группе менеджеров вёл сделку целиком — объявления на классифайдах через MaxPoster, звонки, кредит и страхование, оформление и выдача.","Wagner (Volkswagen, Škoda, SEAT), ноябрь 2019 — июнь 2020: менеджер по продажам новых автомобилей.","Аксель-Моторс, BMW, декабрь 2020 — март 2021: менеджер по продажам новых автомобилей."],"short":"Продажи новых автомобилей и авто с пробегом в Inchcape, Wagner и Аксель-Моторс (BMW). В Inchcape — в пилотной группе, где менеджер вёл сделку целиком."},{"role":"Главный специалист","place":"Росэксперт, Санкт-Петербург","period":"март — ноябрь 2015","bullets":["B2B-продажи через госзакупки: тендерные площадки и процедуры, работа с государственными заказчиками.","Организовывал и сопровождал проекты по специальной оценке условий труда: взаимодействовал с заказчиками, собирал исходную документацию и координировал работу специалистов.","Контролировал сроки выполнения работ, комплектность отчётных материалов и передачу результатов заказчикам."],"short":"B2B-продажи через госзакупки, сопровождение проектов по специальной оценке условий труда."},{"role":"Менеджер по продаже дополнительного оборудования","place":"Автодом (BMW), Санкт-Петербург","period":"2008 — 2012","bullets":["Продавал дополнительное оборудование, официальное дооснащение и услуги. Принимал заказ у клиента, передавал в ремзону и вёл работу двух мастеров до выдачи автомобиля."],"short":"Продавал допоборудование и услуги, вёл заказ от клиента до выдачи и двух мастеров."},{"role":"Технический специалист → старший техник","place":"Автодом (BMW) · РОЛЬФ Витебский · РОЛЬФ Лахта, Санкт-Петербург","period":"2008 — 2015","bullets":["Вёл каждый автомобиль от приёмки до выдачи клиенту: проверка, предпродажная подготовка, установка оборудования, документы. Отвечал за то, чтобы машина была готова точно к дате выдачи.","В РОЛЬФ Лахта вырос до старшего техника: руководил пятью сотрудниками — тремя техниками и двумя мастерами отдела подготовки, распределял между ними работу и принимал результат.","В Автодом пришёл на практику во время учёбы, там же писал диплом и остался работать."],"short":"Вёл автомобили от приёмки до выдачи клиенту. В РОЛЬФ вырос до старшего техника и руководил командой из пяти человек."}],"footer":""},"tools":"Bitrix24 · Jira · Confluence · Redash · 1С · Excel (сводные таблицы, дашборды, ВПР) · Google Workspace · Miro · Zoom, Teams · Tableau, Power BI, Яндекс Метрика, Google Analytics — базовый уровень · AI-ассистенты и агенты: Claude, Perplexity, GigaChat, Алиса AI и другие · Telegram-боты","edu":[{"school":"Санкт-Петербургский автотранспортный колледж","year":"2009","text":"Среднее профессиональное образование, техник: техническое обслуживание и ремонт автомобильного транспорта. В числе десяти лучших студентов прошёл стажировку в BMW Niederlassung Hamburg."},{"school":"СПбГАУ (2013) и МИЭП (2018)","year":"менеджмент","text":"Высшее образование, не завершено: экономический факультет СПбГАУ, факультет экономики и таможенного дела МИЭП."}],"dev":[{"title":"Академия Авито","text":"Программы по B2B-продажам и сопровождению, внедрению цифровых продуктов, клиентскому опыту, продуктовым исследованиям, AI и командной работе."},{"title":"BMW Russland Trading и Volkswagen Group Rus","text":"Корпоративное обучение и сертификация менеджеров по продажам."},{"title":"Академия РОЛЬФ","text":"Продажи, B2B, работа с клиентами, управление персоналом."},{"title":"BMW Niederlassung Hamburg","text":"Обмен опытом по управлению дилерским центром."}],"extra":["Языки: русский — родной, английский — A1","Водительские права категории B, личный автомобиль","Рекомендации — по запросу"]}</script>
<script>
(function(){
var HOST=document.getElementById('gl-resume');if(!HOST||HOST.shadowRoot)return;
var S=JSON.parse(document.getElementById('gl-resume-data').textContent);
var root=HOST.attachShadow({mode:'open'});
root.innerHTML='<style>'+document.getElementById('gl-resume-css').textContent+'</style><div class="page"><div id="app"></div></div>';
var app=root.getElementById('app');
var VK=['kam','pm','ai'];
var qs=new URLSearchParams(location.search);
var RID=(qs.get('id')||'').toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,20);
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var v=(qs.get('v')||ls('gl-ver')||'kam');if(VK.indexOf(v)<0)v='kam';
var mode=qs.get('m')||ls('gl-mode')||'short';if(mode!=='long')mode='short';
var TG='https://t.me/'+String(S.person.telegram||'').replace('@','');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function t(s){return esc(String(s||'').replace(/\s*\[уточнить[^\]]*\]/gi,''))}
function sh(){return mode==='short'}
function sec(title,meta,body,open){return '<details class="sec"'+(open!==false?' open':'')+'><summary><span class="st">'+title+'</span>'+(meta?'<span class="sm">'+esc(meta)+'</span>':'')+'</summary><div class="sb">'+body+'</div></details>'}
function ul(a,c){return '<ul class="'+(c||'bul')+'">'+a.map(function(x){return '<li>'+t(x)+'</li>'}).join('')+'</ul>'}
var LAB=[['Город','city'],['Формат','format'],['Телефон','phone'],['Почта','email'],['Telegram','telegram'],['Ожидания','salary']];
function cval(k,val){
  if(k==='phone')return '<a href="tel:'+esc(val.replace(/[^+\d]/g,''))+'">'+esc(val)+'</a>';
  if(k==='email')return '<a href="mailto:'+esc(val)+'">'+esc(val)+'</a>';
  if(k==='telegram')return '<a href="'+esc(TG)+'" target="_blank" rel="noopener">'+esc(val)+'</a>';
  return esc(val)}
function head(V){var P=S.person,nm=P.name.trim(),i=nm.indexOf(' ');
  return '<header class="head"><div>'+(RID?'<div class="rid-top">Отклик № '+esc(RID)+'</div>':'<div class="eyebrow">Резюме / 2026</div>')
  +'<h1 class="name"><span>'+esc(i>0?nm.slice(0,i):nm)+'</span><span>'+esc(i>0?nm.slice(i+1):'')+'</span></h1>'
  +'<p class="pos">'+t(V.position)+'</p><p class="hl">'+t(V.headline)+'</p></div><div class="side-head">'
  +(P.photo?'<figure class="photo"><img src="'+P.photo+'" alt="'+esc(nm)+'"></figure>':'')
  +'<div class="card contacts">'+LAB.filter(function(l){return P[l[1]]}).map(function(l){return '<div class="crow"><span class="clabel">'+l[0]+'</span><span class="cval">'+cval(l[1],P[l[1]])+'</span></div>'}).join('')+'</div></div></header>'}
function job(j){var V=S.versions[v],b='';
  if(j.avito){b='<p class="ctx">'+t(sh()?j.contextShort:j.context)+'</p><ul class="bul">'+(sh()?V.order.slice(0,V.shortN):V.order).map(function(id){var it=S.items[id];return it?'<li><span class="lead">'+t(it.title)+'</span> '+t(sh()?it.short:it.text)+'</li>':''}).join('')+'</ul>'}
  else b=ul(sh()?j.shortBullets:j.bullets);
  return '<details class="job" open><summary><span class="role">'+t(j.role)+'</span><span class="meta"><span>'+t(j.place)+'</span>'+(j.period?'<span class="per">'+t(j.period)+'</span>':'')+'</span></summary><div class="jb">'+b+'</div></details>'}
function early(){return '<div class="early">'+S.early.groups.map(function(g){return '<article class="card er"><h3 class="role">'+t(g.role)+'</h3><div class="meta"><span>'+t(g.place)+'</span>'+(g.period?'<span class="per">'+t(g.period)+'</span>':'')+'</div>'+(sh()?'<p class="ctx">'+t(g.short)+'</p>':ul(g.bullets))+'</article>'}).join('')+'</div>'}
function feedback(){
  return '<section class="fb" id="gl-fb"><h2>Есть вопрос по резюме?</h2><p>Напишите мне здесь: сообщение сразу придёт мне в Telegram, отвечу в течение дня.'+(RID?' Номер вашей вакансии подставится автоматически.':'')+'</p>'
  +'<div class="row"><button type="button" class="btn primary" data-act="fb">Написать сообщение</button><a class="btn" href="'+esc(TG)+'" target="_blank" rel="noopener">Открыть Telegram</a>'+(RID?'<span class="rid">Отклик № '+esc(RID)+'</span>':'')+'</div></section>'}
function render(){
  var V=S.versions[v],h='';
  h+='<nav class="bar"><div class="grp"><div class="tabs" role="group" aria-label="Версия резюме">'+VK.map(function(k,i){return '<button type="button" data-ver="'+k+'" aria-pressed="'+(k===v)+'"><span class="dot d'+i+'"></span>'+esc(S.versions[k].label)+'</button>'}).join('')+'</div>'
   +'<div class="seg" role="group" aria-label="Объём"><button type="button" data-mode="short" aria-pressed="'+sh()+'">Кратко</button><button type="button" data-mode="long" aria-pressed="'+(!sh())+'">Подробно</button></div></div>'
   +'<div class="grp"><button type="button" class="btn primary" data-act="fb">Задать вопрос</button></div></nav>';
  h+=head(V);
  var main=sec('Обо мне','',ul(sh()?V.aboutShort:V.about,'paras'))
   +sec('Ключевой опыт','',S.jobs.map(job).join(''))
   +sec('Ранний опыт',S.early.period,early());
  var side=sec('Образование','','<ul class="tl">'+S.edu.map(function(e){return '<li><span class="sch">'+t(e.school)+'</span><span class="yr">'+t(e.year)+'</span>'+(sh()?'':'<span class="tx">'+t(e.text)+'</span>')+'</li>'}).join('')+'</ul>')
   +sec('Развитие','','<ul class="dl">'+S.dev.map(function(d){return '<li><span class="ttl">'+t(d.title)+'</span>'+(sh()?'':'<span class="tx">'+t(d.text)+'</span>')+'</li>'}).join('')+'</ul>')
   +sec('Навыки','',ul(sh()?V.skills.slice(0,8):V.skills,'pills')+(sh()?'':'<p class="ctx">'+t(S.tools)+'</p>'))
   +sec('Дополнительно','',ul(S.extra));
  h+='<div class="cols"><div class="main">'+main+'</div><aside class="side">'+side+'</aside></div>'+feedback();
  app.innerHTML='<div class="wrap">'+h+'</div>'}
function goFeedback(){
  var a=document.querySelector('a[name="feedback"]')||document.getElementById('feedback');
  if(a){(a.closest('.r')||a).scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){var f=document.querySelector('.t-form textarea, .t-form input[type="text"]');if(f)try{f.focus({preventScroll:true})}catch(e){}},700)}
  else window.open(TG,'_blank','noopener')}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-ver]');if(b){v=b.dataset.ver;ls('gl-ver',v);render();return}
  b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;ls('gl-mode',mode);render();return}
  b=e.target.closest('[data-act="fb"]');if(b){goFeedback()}});
/* реестровый номер -> скрытое поле формы Тильды (имя поля: reg_id) */
function fill(){document.querySelectorAll('input[name="reg_id"]').forEach(function(i){if(RID&&!i.value)i.value=RID})
  document.querySelectorAll('input[name="resume_version"]').forEach(function(i){i.value=v})}
fill();var n=0,iv=setInterval(function(){fill();if(++n>20)clearInterval(iv)},500);
document.addEventListener('submit',fill,true);document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.t-submit'))fill()},true);
render();
})();
</script>

</body></html>

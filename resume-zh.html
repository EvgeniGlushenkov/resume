<!doctype html><html lang="zh-CN"><head><title>简历 — 叶夫根尼 格卢申科夫</title><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style>body{background:#f8f8f6}</style></head><body>
<!-- Резюме Евгения Глушенкова · публичная версия · вставить в блок T123 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<div id="gl-resume"></div>
<script type="text/plain" id="gl-resume-css">/* Layout: плоская светлая страница, как сайт на Tilda; шапка с именем слева и фото с карточкой контактов справа; ниже плитки с цифрами, две колонки (опыт / образование и навыки) и заметки для себя под резюме */
:host{display:block;
  --bg:#f8f8f6; --surface:#ffffff; --ink:#12140f; --muted:#6a6c66; --line:#e7e7e3;
  --c-blue:#aee4f8; --c-green:#bdf0d2; --c-pink:#ffc3cc; --c-lilac:#dcc4f6; --c-yellow:#f6e8ae;
  --todo-bg:#f6e8ae; --todo-fg:#4d3d00; --danger:#b3261e;
  --f-display:"Manrope","Noto Sans SC","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --f-body:"Manrope","Noto Sans SC","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}


*{box-sizing:border-box}
.page{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--f-body);padding-inline:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-block:12px 64px;display:grid;gap:clamp(24px,4vw,44px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,.ed:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono,.eyebrow,.clabel,.meta,.sm{font-family:var(--f-mono)}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
/* верхняя панель */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.bar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs,.seg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.tabs button,.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.d0{background:var(--c-blue)}.d1{background:var(--c-lilac)}.d2{background:var(--c-pink)}
.tabs button[aria-pressed="false"] .dot{outline:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.on{background:var(--c-yellow);border-color:var(--ink)}
/* шапка */
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:28px clamp(28px,5vw,64px);align-items:start;padding-top:clamp(8px,3vw,28px)}
.name{margin:14px 0 0;font:800 clamp(44px,8.6vw,96px)/.95 var(--f-display);letter-spacing:-.045em}
.name span{display:block;overflow-wrap:anywhere}
.pos{white-space:pre-line;margin:clamp(20px,3.5vw,36px) 0 0;font:700 clamp(19px,2.5vw,27px)/1.25 var(--f-display);letter-spacing:-.02em;max-width:24ch;text-wrap:balance}
.hl{margin:12px 0 0;color:var(--muted);font-size:15px;max-width:48ch}
.side-head{display:grid;gap:14px;min-width:0}
.photo{margin:0;width:min(100%,300px);aspect-ratio:1/0.92;border-radius:58% 42% 55% 45%/48% 56% 44% 52%;overflow:hidden;background:var(--c-blue)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.card{background:var(--surface);border-radius:20px;padding:18px 20px}
.contacts{display:grid;padding-block:6px}
.crow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.clabel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.cval{font-weight:600;font-size:14.5px;overflow-wrap:anywhere;min-width:0}
/* плитки */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{border-radius:20px;padding:18px 20px;display:grid;gap:14px;align-content:space-between;min-height:132px}
.tile:nth-child(1){background:var(--c-blue)}.tile:nth-child(2){background:var(--c-green)}.tile:nth-child(3){background:var(--c-pink)}.tile:nth-child(4){background:var(--c-lilac)}
.tile .n{font:800 clamp(26px,4vw,44px)/1 var(--f-display);letter-spacing:-.04em;white-space:nowrap}
.tile .t{font-size:13px;line-height:1.4}
/* колонки */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:clamp(28px,5vw,56px);align-items:start}
.main,.side{display:grid;gap:clamp(28px,4vw,44px);min-width:0;align-content:start}
.sec>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:0 0 16px;cursor:pointer}
.sec>summary::-webkit-details-marker,.job>summary::-webkit-details-marker{display:none}
.sec>summary::before,.job>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
.sec[open]>summary::before,.job[open]>summary::before{transform:rotate(45deg)}
.st{font:800 clamp(22px,2.6vw,28px)/1.1 var(--f-display);letter-spacing:-.03em;min-width:0}
.sm{white-space:nowrap}
.side .st{font-size:22px}
.sm{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.copy{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.copy:hover{color:var(--ink);border-color:var(--ink)}
.sb{display:grid;gap:14px;min-width:0}
.note{margin:0;font-size:13px;color:var(--todo-fg);background:var(--todo-bg);padding:9px 14px;border-radius:12px}
.paras{list-style:none;margin:0;padding:0;display:grid;gap:14px;max-width:66ch;color:var(--muted);font-size:16px}
.paras li:first-child{color:var(--ink);font-size:17px}
.bul{margin:0;padding-left:18px;display:grid;gap:10px;max-width:72ch;color:var(--muted)}
.bul li::marker{color:var(--ink)}
.lead{font-weight:700;color:var(--ink)}
/* карточки опыта */
.job{background:var(--surface);border-radius:20px;padding:18px 20px}
.job+.job{margin-top:12px}
.job>summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;cursor:pointer}
.job>summary .role{grid-column:2}
.job>summary .meta{grid-column:2}
.role{margin:0;font:700 clamp(16px,1.9vw,19px)/1.3 var(--f-display);letter-spacing:-.015em;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.per{background:var(--c-blue);color:var(--ink);border-radius:999px;padding:2px 10px;white-space:nowrap}
.jb{padding:16px 0 4px;display:grid;gap:14px;border-top:1px solid var(--line);margin-top:14px}
.ctx{margin:0;color:var(--muted);font-size:14px;max-width:72ch}
.fields{display:grid;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:14px}
.fields label{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:baseline;font-size:13px;color:var(--muted)}
.fields label>*:last-child{color:var(--ink);font-size:14px}
.early{display:grid;gap:12px}
.er{display:grid;gap:8px}
.er .ctx{max-width:none}
/* навыки, образование */
.pills{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.pills li{border-radius:999px;padding:5px 13px;font-size:13.5px;font-weight:500}
.pills li:nth-child(4n+1){background:var(--c-blue)}.pills li:nth-child(4n+2){background:var(--c-green)}.pills li:nth-child(4n+3){background:var(--c-pink)}.pills li:nth-child(4n){background:var(--c-lilac)}
.tl{list-style:none;margin:0 0 0 4px;padding:0 0 0 22px;border-left:1.5px solid var(--ink);display:grid;gap:20px}
.tl>li{position:relative;display:grid;gap:2px}
.tl>li::before{content:"";position:absolute;left:-27.5px;top:.45em;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.tl .sch{font-weight:700;font-size:15px;line-height:1.35}
.tl .yr{font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tl .tx{font-size:13.5px;color:var(--muted);line-height:1.5}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.dl li{display:grid;gap:2px;padding-left:14px;border-left:3px solid var(--c-lilac)}
.dl .ttl{font-weight:700;font-size:14.5px}
.dl .tx{font-size:13.5px;color:var(--muted);line-height:1.5}
.side .bul{font-size:14px;padding-left:16px}
/* заметки для себя */
.notes{display:grid;gap:clamp(20px,3vw,32px);padding-top:clamp(16px,3vw,32px);border-top:1px solid var(--line)}
.notes>.eyebrow{margin:0}
.qa{display:grid;gap:16px}
.qa .q{font-weight:700;margin:0}
.qa .a{margin:4px 0 0;max-width:72ch;color:var(--muted)}
mark.todo{background:var(--todo-bg);color:var(--todo-fg);border-radius:4px;padding:0 4px;font-size:.92em}
@media (max-width:860px){
  .head,.cols{grid-template-columns:minmax(0,1fr)}
  .photo{width:min(100%,240px)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .sec>summary{flex-wrap:wrap}
  .sm{white-space:normal}
  .fields label{grid-template-columns:1fr}
  .crow{grid-template-columns:84px minmax(0,1fr)}
  .tile{min-height:112px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.page{text-align:left}
.wrap{grid-template-columns:minmax(0,1fr)}
p,h1,h3{color:inherit}
a{color:inherit}
.fb{background:var(--c-green);border-radius:24px;padding:clamp(20px,3vw,32px);display:grid;gap:14px}
.fb h2{margin:0;font:800 clamp(24px,3vw,34px)/1.1 var(--f-display);letter-spacing:-.03em}
.fb p{margin:0;max-width:60ch;font-size:15.5px}
.fb .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb .btn{text-decoration:none;display:inline-flex;align-items:center}
.fb .rid{font:500 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.75}
@media (max-width:560px){.bar{position:static}.bar .grp{width:100%}.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 100%}.seg{flex:none}.tabs button{white-space:nowrap;flex:none}.bar .grp:last-child .btn{width:100%;justify-content:center}}
.rid-top{font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* единая шапка: версии, объём и кнопки в одну строку */
.page{padding-inline:40px}
.wrap{max-width:1240px}
.bar{padding-block:20px;flex-wrap:nowrap;gap:12px 20px}
.bar .grp:first-child{flex:1 1 auto;min-width:0}
.bar .grp:last-child{flex:none;flex-wrap:nowrap}
.hb{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font:500 11px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;border-radius:999px;padding:11px 20px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);white-space:nowrap;transition:transform .2s ease,background .2s ease,border-color .2s ease}
.hb:hover{transform:translateY(-2px);background:#13a7e5;border-color:#13a7e5}
.hb.back{background:#7c2ae8;border-color:#7c2ae8;color:#fff}
.hb.back:hover{background:#5b17b8;border-color:#5b17b8}
@media (max-width:900px){.page{padding-inline:16px}.bar{flex-wrap:wrap}}
@media (max-width:560px){.bar .grp:last-child{width:100%}.hb{flex:1}}

var S=JSON.parse(document.getElementById('gl-resume-data').textContent);
var root=HOST.attachShadow({mode:'open'});
root.innerHTML='<style>'+document.getElementById('gl-resume-css').textContent+'</style><div class="page"><div id="app"></div></div>';
var app=root.getElementById('app');
var VK=['kam','pm','ai'];
var qs=new URLSearchParams(location.search);
var RID=(qs.get('id')||'').toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,20);
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var v=(qs.get('v')||ls('gl-ver')||'kam');if(VK.indexOf(v)<0)v='kam';
var mode=qs.get('m')||ls('gl-mode')||'short';if(mode!=='long')mode='short';
var TG='https://t.me/'+String(S.person.telegram||'').replace('@','');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function t(s){return esc(String(s||'').replace(/\s*\[уточнить[^\]]*\]/gi,''))}
function sh(){return mode==='short'}
function sec(title,meta,body,open){return '<details class="sec"'+(open!==false?' open':'')+'><summary><span class="st">'+title+'</span>'+(meta?'<span class="sm">'+esc(meta)+'</span>':'')+'</summary><div class="sb">'+body+'</div></details>'}
function ul(a,c){return '<ul class="'+(c||'bul')+'">'+a.map(function(x){return '<li>'+t(x)+'</li>'}).join('')+'</ul>'}
var LAB=[['工作方式','format'],['常驻地','city'],['电话','phone'],['邮箱','email'],['Telegram','telegram'],['期望薪资','salary']];
function cval(k,val){
  if(k==='phone')return '<a href="tel:'+esc(val.replace(/[^+\d]/g,''))+'">'+esc(val)+'</a>';
  if(k==='email')return '<a href="mailto:'+esc(val)+'">'+esc(val)+'</a>';
  if(k==='telegram')return '<a href="'+esc(TG)+'" target="_blank" rel="noopener">'+esc(val)+'</a>';
  return esc(val)}
function head(V){var P=S.person,nm=P.name.trim(),i=nm.indexOf(' ');
  return '<header class="head"><div>'+(RID?'<div class="rid-top">应聘编号 '+esc(RID)+'</div>':'<div class="eyebrow">简历 / 2026</div>')
  +'<h1 class="name"><span>'+esc(i>0?nm.slice(0,i):nm)+'</span><span>'+esc(i>0?nm.slice(i+1):'')+'</span></h1>'
  +'<p class="pos">'+t(V.position)+'</p><p class="hl">'+t(V.headline)+'</p></div><div class="side-head">'
  +(P.photo?'<figure class="photo"><img src="'+P.photo+'" alt="'+esc(nm)+'"></figure>':'')
  +'<div class="card contacts">'+LAB.filter(function(l){return P[l[1]]}).map(function(l){return '<div class="crow"><span class="clabel">'+l[0]+'</span><span class="cval">'+cval(l[1],P[l[1]])+'</span></div>'}).join('')+'</div></div></header>'}
function job(j){var V=S.versions[v],b='';
  if(j.avito){b='<p class="ctx">'+t(sh()?j.contextShort:j.context)+'</p><ul class="bul">'+(sh()?V.order.slice(0,V.shortN):V.order).map(function(id){var it=S.items[id];return it?'<li><span class="lead">'+t(it.title)+'</span> '+t(sh()?it.short:it.text)+'</li>':''}).join('')+'</ul>'}
  else b=ul(sh()?j.shortBullets:j.bullets);
  return '<details class="job" open><summary><span class="role">'+t(j.role)+'</span><span class="meta"><span>'+t(j.place)+'</span>'+(j.period?'<span class="per">'+t(j.period)+'</span>':'')+'</span></summary><div class="jb">'+b+'</div></details>'}
function early(){return '<div class="early">'+S.early.groups.map(function(g){return '<article class="card er"><h3 class="role">'+t(g.role)+'</h3><div class="meta"><span>'+t(g.place)+'</span>'+(g.period?'<span class="per">'+t(g.period)+'</span>':'')+'</div>'+(sh()?'<p class="ctx">'+t(g.short)+'</p>':ul(g.bullets))+'</article>'}).join('')+'</div>'}
function feedback(){
  return '<section class="fb" id="gl-fb"><h2>对简历有疑问？</h2><p>在这里给我留言：消息会直接发到我的 Telegram，我会在一天内回复。'+(RID?' 您的职位编号将自动填入。':'')+'</p>'
  +'<div class="row"><button type="button" class="btn primary" data-act="fb">发送消息</button><a class="btn" href="'+esc(TG)+'" target="_blank" rel="noopener">打开 Telegram</a>'+(RID?'<span class="rid">应聘编号 '+esc(RID)+'</span>':'')+'</div></section>'}
function render(){
  var V=S.versions[v],h='';
  h+='<nav class="bar"><div class="grp"><div class="tabs" role="group" aria-label="简历版本">'+VK.map(function(k,i){return '<button type="button" data-ver="'+k+'" aria-pressed="'+(k===v)+'"><span class="dot d'+i+'"></span>'+esc(S.versions[k].label)+'</button>'}).join('')+'</div>'
   +'<div class="seg" role="group" aria-label="篇幅"><button type="button" data-mode="short" aria-pressed="'+sh()+'">简版</button><button type="button" data-mode="long" aria-pressed="'+(!sh())+'">详版</button></div></div>'
   +'<div class="grp"><a class="hb back" href="zh.html">← 返回首页</a><a class="hb" href="'+esc(TG)+'" target="_blank" rel="noopener">联系我</a></div></nav>';
  h+=head(V);
  var main=sec('关于我','',ul(sh()?V.aboutShort:V.about,'paras'))
   +sec('核心经历','',S.jobs.map(job).join(''))
   +sec('早期经历',S.early.period,early());
  var side=sec('教育','','<ul class="tl">'+S.edu.map(function(e){return '<li><span class="sch">'+t(e.school)+'</span><span class="yr">'+t(e.year)+'</span>'+(sh()?'':'<span class="tx">'+t(e.text)+'</span>')+'</li>'}).join('')+'</ul>')
   +sec('培训与发展','','<ul class="dl">'+S.dev.map(function(d){return '<li><span class="ttl">'+t(d.title)+'</span>'+(sh()?'':'<span class="tx">'+t(d.text)+'</span>')+'</li>'}).join('')+'</ul>')
   +sec('技能','',ul(sh()?V.skills.slice(0,8):V.skills,'pills')+(sh()?'':'<p class="ctx">'+t(S.tools)+'</p>'))
   +sec('其他信息','',ul(S.extra));
  h+='<div class="cols"><div class="main">'+main+'</div><aside class="side">'+side+'</aside></div>'+feedback();
  app.innerHTML='<div class="wrap">'+h+'</div>'}
function goFeedback(){
  var a=document.querySelector('a[name="feedback"]')||document.getElementById('feedback');
  if(a){(a.closest('.r')||a).scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){var f=document.querySelector('.t-form textarea, .t-form input[type="text"]');if(f)try{f.focus({preventScroll:true})}catch(e){}},700)}
  else window.open(TG,'_blank','noopener')}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-ver]');if(b){v=b.dataset.ver;ls('gl-ver',v);render();return}
  b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;ls('gl-mode',mode);render();return}
  b=e.target.closest('[data-act="fb"]');if(b){goFeedback()}});
/* реестровый номер -> скрытое поле формы Тильды (имя поля: reg_id) */
function fill(){document.querySelectorAll('input[name="reg_id"]').forEach(function(i){if(RID&&!i.value)i.value=RID})
  document.querySelectorAll('input[name="resume_version"]').forEach(function(i){i.value=v})}
fill();var n=0,iv=setInterval(function(){fill();if(++n>20)clearInterval(iv)},500);
document.addEventListener('submit',fill,true);document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.t-submit'))fill()},true);
render();
})();
</script>

</body></html>

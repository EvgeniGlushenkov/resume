<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
<title>Админка резюме</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f8f8f6;--surface:#fff;--ink:#12140f;--muted:#6a6c66;--line:#e7e7e3;--blue:#aee4f8;--green:#bdf0d2;--pink:#ffc3cc;--lilac:#dcc4f6;--yellow:#f6e8ae;--danger:#b3261e;--acc:#7c2ae8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Manrope,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover:not(:disabled){background:var(--acc);border-color:var(--acc)}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.fld>.btn{justify-self:start}
.btn.sm{padding:3px 10px;font-size:12px}
.btn.del:hover{color:var(--danger);border-color:var(--danger)}
/* вход */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px;display:grid;gap:14px}
.eyebrow{font:500 11px/1 "DM Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.lbox h1{margin:0;font:800 30px/1.1 Manrope,sans-serif;letter-spacing:-.03em}
.lbox p{margin:0;color:var(--muted)}
.err{color:var(--danger);min-height:20px;font-size:14px}
.wait{background:var(--yellow);border-radius:14px;padding:12px 16px;font-size:14px}
/* рабочая область */
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
header.top .ttl{font:800 20px/1 Manrope,sans-serif;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block}
.dot.dirty{background:var(--yellow);outline:1px solid var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#status{font-size:13px;color:var(--muted);max-width:340px}
#status.ok{color:#17653a}#status.bad{color:var(--danger)}
.work{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:20px;padding:20px;align-items:start}
#form{display:grid;gap:12px;min-width:0}
#preview{position:sticky;top:76px;height:calc(100vh - 96px);border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
#preview iframe{width:100%;height:100%;border:0}
details.sec{background:var(--surface);border-radius:18px;padding:0 18px;border:1px solid var(--line)}
details.sec>summary{cursor:pointer;list-style:none;padding:14px 0;font:800 17px/1.2 Manrope,sans-serif;letter-spacing:-.02em;display:flex;gap:10px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(45deg)}
details.sec[open]{padding-bottom:16px}
details.sec details.sec{border-radius:14px;margin-top:10px;background:var(--bg)}
details.sec details.sec>summary{font-size:15px}
.body{display:grid;gap:12px}
.fld{display:grid;gap:4px}
.fld>label,.lab{font:500 11px/1.2 "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;color:var(--ink);background:#fff;resize:vertical}
textarea{min-height:44px;line-height:1.5}
input:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:0;border-color:transparent}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
.ctl{display:flex;gap:4px}
.card{border:1px dashed #d4d4cd;border-radius:14px;padding:12px;display:grid;gap:10px;background:#fff}
.card>.hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card>.hd b{font-size:14px}
.list{display:grid;gap:8px}
.note{font-size:13px;color:var(--muted)}
@media(max-width:1000px){.work{grid-template-columns:1fr}#preview{position:static;height:70vh}}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="login">
  <div class="lbox">
    <a class="btn sm" href="../resume.html" style="text-decoration:none;color:inherit;display:inline-block;margin-bottom:14px">← На сайт</a>
    <div class="eyebrow">Закрытый раздел</div>
    <h1>Админка резюме</h1>
    <p>Вход подтверждается в Telegram: придёт сообщение с кнопкой. Либо откройте одноразовую ссылку, которую выдаёт бот по команде /admin.</p>
    <div id="lwait" class="wait" hidden></div>
    <div id="lerr" class="err" role="alert"></div>
    <button id="lgo" class="btn primary" type="button">Войти через Telegram</button>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="ttl"><a class="btn sm" href="../resume.html" title="Вернуться на сайт">← На главную</a><span id="dot" class="dot"></span>Админка резюме</div>
    <div class="acts">
      <span id="status" role="status"></span>
      <button class="btn" id="undo" type="button">Отменить правки</button>
      <button class="btn" id="dl" type="button">Скачать JSON</button>
      <a class="btn" href="../resume.html" target="_blank" rel="noopener">Открыть сайт в новой вкладке</a>
      <button class="btn primary" id="save" type="button">Сохранить на сайт</button>
      <button class="btn" id="out" type="button">Выйти</button>
    </div>
  </header>
  <div class="work">
    <div id="form"></div>
    <div id="preview"><iframe id="pv" title="Предпросмотр резюме"></iframe></div>
  </div>
</div>
<script src="admin.js"></script>
</body>
</html>
